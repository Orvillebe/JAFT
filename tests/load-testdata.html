<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAFT test data</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f3f2ee; color: #1d2321; max-width: 560px; margin: 0 auto; padding: 40px 16px; line-height: 1.5 }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 16px; cursor: pointer; margin: 6px 6px 0 0 }
  .go { background: #0f6b5c; color: #fff }
  .clear { background: #fff; color: #a8402a; border: 1px solid #e3e1db }
  #out { margin-top: 16px; font-size: 14px }
</style>
</head>
<body>
<!-- Testing only: fills the local version of JAFT (this browser) with a test data set. Never touches Supabase. -->
<h1>JAFT test data</h1>
<p>This replaces everything in the <b>local</b> version of JAFT in this browser with a test data set. Supabase is never touched.</p>
<button class="go" id="load">Load test data</button>
<button class="clear" id="clear">Empty local data</button>
<div id="out"></div>
<p><a href="../index.html">Open JAFT ›</a></p>
<script src="../config.js"></script>
<script src="../model.js"></script>
<script src="testdata.js"></script>
<script>
  const KEY = 'jaft_local_v1';
  document.getElementById('load').onclick = () => {
    if (!confirm('Replace all local data with test data?')) return;
    const db = makeTestData(JAFT_CONFIG, Model);
    localStorage.setItem(KEY, JSON.stringify(db));
    document.getElementById('out').textContent = `Loaded: ${db.persons.length} persons, ${db.companies.length} companies, ${db.history_entries.length} history entries.`;
  };
  document.getElementById('clear').onclick = () => {
    if (!confirm('Delete all local data?')) return;
    localStorage.removeItem(KEY);
    document.getElementById('out').textContent = 'Local data removed. JAFT starts empty next time.';
  };
</script>
</body>
</html>
