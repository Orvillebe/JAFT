<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <rect width="180" height="180" rx="40" fill="#28282c"/>
  <!-- A funnel that reads as an exclamation mark: wide at the top (many contacts), narrowing to the spout,
       with a hand-drawn circle underneath (an opdracht), drawn like the circle in the Orville logo. -->
  <path d="M50 30H130L99 80V110H81V80Z" fill="none" stroke="#c4c71e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke="#c4c71e" stroke-linecap="round" stroke-linejoin="round">
    <!-- Two loose passes of a pen that don't quite cover each other, the last one overshooting its start. -->
    <path d="M100 131C91 126 76 129 75.5 142C75 154 86 159.5 95 157C104 154.5 107 145 103.5 137.5" stroke-width="5.5"/>
    <path d="M84.5 132.5C92 128.5 105.5 131 106 142.5C106.5 153 97 159.5 88 158C80 156.5 76.5 149 78 142.5C79.5 135.5 86 131 94 131.5C99 132 102.5 134 104.5 137" stroke-width="3"/>
  </g>
</svg>
